<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz JavaScript Frontend</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #f1f5f9;
    background: linear-gradient(120deg, #020617, #0f172a, #1e1b4b, #082f49, #020617);
    background-size: 300% 300%;
    animation: drift 22s ease infinite;
    min-height: 100vh;
  }
  @keyframes drift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes enter { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .box { width: 100%; max-width: 680px; }
  .top { display: flex; justify-content: space-between; color: #94a3b8; font-size: 14px; }
  .prog { height: 6px; margin-top: 10px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .prog div { height: 100%; background: linear-gradient(90deg, #fcd34d, #facc15); transition: width .8s cubic-bezier(.2,.8,.2,1); }

  .card { margin-top: 24px; background: rgba(15,23,42,.75); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; padding: 28px; box-shadow: 0 25px 60px rgba(0,0,0,.45); }
  .enter { animation: enter .5s cubic-bezier(.2,.8,.2,1) both; }
  .tag { display: inline-block; background: rgba(250,204,21,.15); color: #fde047; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 5px 12px; border-radius: 99px; }
  .q { font-size: 20px; line-height: 1.5; font-weight: 600; margin-top: 16px; }
  pre { background: rgba(0,0,0,.5); color: #fef08a; padding: 16px; border-radius: 12px; overflow-x: auto; font-size: 14px; line-height: 1.6; margin-top: 16px; border: 1px solid rgba(255,255,255,.08); }

  .opts { display: grid; gap: 12px; margin-top: 22px; }
  .shake { animation: shake .45s ease; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); background: rgba(30,41,59,.6); color: #e2e8f0; font: inherit; font-size: 16px; line-height: 1.4; cursor: pointer; transition: all .2s; }
  .opt:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(250,204,21,.6); background: rgba(30,41,59,.95); }
  .opt:disabled { cursor: default; }
  .l { width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; background: rgba(255,255,255,.1); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .opt.ok { background: rgba(16,185,129,.15); border-color: rgba(52,211,153,.7); color: #d1fae5; }
  .opt.bad { background: rgba(244,63,94,.15); border-color: rgba(251,113,133,.7); color: #ffe4e6; }
  .opt.dim { opacity: .45; }

  .exp { margin-top: 18px; padding: 16px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); font-size: 15px; line-height: 1.6; color: #cbd5e1; }
  .exp b.ok { color: #6ee7b7; }
  .exp b.bad { color: #fda4af; }

  .actions { display: flex; justify-content: flex-end; margin-top: 22px; }
  .btn { font: inherit; font-weight: 700; padding: 12px 24px; border-radius: 14px; border: none; background: #facc15; color: #0f172a; cursor: pointer; transition: transform .2s; }
  .btn:hover:not(:disabled) { transform: scale(1.04); }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn.ghost { background: transparent; color: #e2e8f0; border: 1px solid rgba(255,255,255,.2); }

  .ring { position: relative; width: 190px; height: 190px; margin: 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .pct { font-size: 38px; font-weight: 900; }
  .cap { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #94a3b8; }
  .res-title { text-align: center; font-size: 22px; font-weight: 700; margin-top: 20px; }
  .res-msg { text-align: center; color: #cbd5e1; margin-top: 8px; }
  .bars { margin-top: 28px; display: grid; gap: 16px; }
  .bar-h { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; color: #e2e8f0; }
  .bar-h span:last-child { color: #94a3b8; font-weight: 600; }
  .bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: linear-gradient(90deg, #fcd34d, #facc15); border-radius: 99px; transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .end { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
</style>
</head>
<body>

    ["Un conjunto de reglas que permite a programas comunicarse entre sí", "Un lenguaje de programación", "Un navegador web", "Un tipo de base de datos"],
    "Una API define cómo pedir y recibir información entre sistemas."],
  ["API y fetch", "¿Qué devuelve la función fetch()?", null,
    ["Una Promise", "Un texto", "Un número", "Un elemento HTML"],
    "fetch() devuelve una Promise, que se resuelve con la respuesta de la petición."],
  ["API y fetch", "En el ejemplo GET, ¿para qué sirve .then(response => response.json())?", "fetch('https://jsonplaceholder.typicode.com/posts/1')\n  .then(response => response.json())",
    ["Para convertir la respuesta a JSON", "Para enviar datos por POST", "Para cancelar la petición", "Para crear un elemento"],
    "response.json() transforma la respuesta del servidor en un objeto de JavaScript."],
  ["API y fetch", "En el ejemplo POST del documento, ¿qué método HTTP se utiliza?", null,
    ["POST", "GET", "DELETE", "PUT"],
    "El ejemplo envía datos al servidor con el método POST."],
  ["API y fetch", "¿Para qué sirve JSON.stringify() en el ejemplo POST?", "body: JSON.stringify({ title: \"Hola mundo\" })",
    ["Convierte los datos en texto JSON para enviarlos", "Lee la respuesta del servidor", "Cambia el método HTTP", "Crea una Promise"],
    "JSON.stringify transforma el objeto en texto con formato JSON."],
  ["API y fetch", "¿Para qué sirve el bloque .catch() en una petición con fetch?", ".catch(error => console.error('Error:', error));",
    ["Manejar los errores de la petición", "Confirmar el envío", "Convertir la respuesta a JSON", "Iniciar un bucle"],
    "catch se ejecuta cuando la petición falla."],
  ["API y fetch", "¿Cuál es un ejemplo cotidiano de uso de una API?", null,
    ["Una app del clima que muestra la temperatura actual", "Un teclado físico", "Un cable HDMI", "Un monitor"],
    "La app pide datos del clima a un servidor mediante una API y los muestra en pantalla."]
];

const ITEMS = RAW.map(([t, q, c, o, e]) => ({ t, q, c, o, e }));
const C = 2 * Math.PI * 52;
const app = document.getElementById("app");
let S = { deck: [], idx: 0, sel: null, log: [], done: false, fresh: true };

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function build(items) {
  return shuffle(items).map(base => ({
    t: base.t, q: base.q, c: base.c, base: base,
    opts: shuffle(base.o.map((text, i) => ({ text: text, ok: i === 0 })))
  }));
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function score() { return S.log.filter(x => x.ok).length; }

function renderQuiz() {
  const cur = S.deck[S.idx];
  const n = S.deck.length;
  const answered = S.sel !== null;
  const opts = cur.opts.map((o, i) => {
    let cls = "opt";
    if (answered) {
      if (o.ok) cls += " ok";
      else if (i === S.sel) cls += " bad";
      else cls += " dim";
    }
    return '<button class="' + cls + '" data-opt="' + i + '"' + (answered ? " disabled" : "") + '>' +
      '<span class="l">' + "ABCD"[i] + '</span><span>' + esc(o.text) + '</span></button>';
  }).join("");
  const exp = answered
    ? '<div class="exp"><b class="' + (cur.opts[S.sel].ok ? "ok" : "bad") + '">' +
      (cur.opts[S.sel].ok ? "Correcto." : "Incorrecto.") + '</b> ' + esc(cur.base.e) + '</div>'
    : "";
  const last = S.idx + 1 === n;
  app.innerHTML =
    '<div class="wrap"><div class="box">' +
      '<div class="top"><span>Pregunta ' + (S.idx + 1) + ' de ' + n + '</span><span>Aciertos ' + score() + '</span></div>' +
      '<div class="prog"><div style="width:' + (S.idx / n) * 100 + '%"></div></div>' +
      '<div class="card' + (S.fresh ? " enter" : "") + '">' +
        '<span class="tag">' + esc(cur.t) + '</span>' +
        '<h2 class="q">' + esc(cur.q) + '</h2>' +
        (cur.c ? '<pre><code>' + esc(cur.c) + '</code></pre>' : "") +
        '<div class="opts" id="opts">' + opts + '</div>' +
        exp +
        '<div class="actions"><button class="btn" data-next="1"' + (answered ? "" : " disabled") + '>' +
          (last ? "Ver resultados" : "Siguiente") + '</button></div>' +
      '</div>' +
    '</div></div>';
}

function renderResults() {
  const n = S.deck.length;
  const sc = score();
  const pct = Math.round((sc / n) * 100);
  const stats = {};
  S.log.forEach(x => {
    stats[x.t] = stats[x.t] || { ok: 0, total: 0 };
    stats[x.t].total++;
    if (x.ok) stats[x.t].ok++;
  });
  const errs = S.log.filter(x => !x.ok).map(x => x.base);
  const msg = pct >= 90 ? "Dominio excelente de los fundamentos de JavaScript."
    : pct >= 70 ? "Muy buen resultado. Repasa las secciones con menor puntaje."
    : pct >= 50 ? "Buen avance. Refuerza variables, bucles y eventos."
    : "Vuelve a revisar el material y repite el cuestionario.";
  const bars = Object.keys(stats).map(t => {
    const v = stats[t];
    const p = Math.round((v.ok / v.total) * 100);
    return '<div><div class="bar-h"><span>' + esc(t) + '</span><span>' + v.ok + ' / ' + v.total + '</span></div>' +
      '<div class="bar"><div data-w="' + p + '"></div></div></div>';
  }).join("");
  app.innerHTML =
    '<div class="wrap"><div class="box"><div class="card enter">' +
      '<div class="ring"><svg viewBox="0 0 120 120">' +
        '<circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>' +
        '<circle id="aro" cx="60" cy="60" r="52" fill="none" stroke="#facc15" stroke-width="10" stroke-linecap="round" ' +
          'stroke-dasharray="' + C + '" style="stroke-dashoffset:' + C + ';transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"/>' +
      '</svg><div class="c"><div><div class="pct">' + pct + '%</div><div class="cap">Puntaje</div></div></div></div>' +
      '<div class="res-title">' + sc + ' de ' + n + ' respuestas correctas</div>' +
      '<div class="res-msg">' + msg + '</div>' +
      '<div class="bars">' + bars + '</div>' +
      '<div class="end">' +
        '<button class="btn ghost" data-act="repasar"' + (errs.length ? "" : " disabled") + '>Repasar ' + errs.length + ' ' + (errs.length === 1 ? "error" : "errores") + '</button>' +
        '<button class="btn" data-act="reiniciar">Empezar de nuevo</button>' +
      '</div>' +
    '</div></div></div>';
  setTimeout(() => {
    document.getElementById("aro").style.strokeDashoffset = C * (1 - pct / 100);
    document.querySelectorAll(".bar div").forEach(d => { d.style.width = d.dataset.w + "%"; });
  }, 120);
}

function reset(items) {
  S = { deck: build(items), idx: 0, sel: null, log: [], done: false, fresh: true };
  renderQuiz();
}

function pick(i) {
  if (S.done || S.sel !== null) return;
  const cur = S.deck[S.idx];
  const o = cur.opts[i];
  if (!o) return;
  S.sel = i;
  S.fresh = false;
  S.log.push({ t: cur.t, ok: o.ok, base: cur.base });
  renderQuiz();
  if (!o.ok) document.getElementById("opts").classList.add("shake");
}

function next() {
  if (S.sel === null) return;
  S.idx++;
  S.sel = null;
  S.fresh = true;
  if (S.idx >= S.deck.length) { S.done = true; renderResults(); }
  else renderQuiz();
}

app.addEventListener("click", e => {
  const opt = e.target.closest("[data-opt]");
  if (opt) { pick(Number(opt.dataset.opt)); return; }
  if (e.target.closest("[data-next]")) { next(); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    if (act.dataset.act === "reiniciar") reset(ITEMS);
    else reset(S.log.filter(x => !x.ok).map(x => x.base));
  }
});

document.addEventListener("keydown", e => {
  if (S.done || e.key.length !== 1 && e.key !== "Enter") return;
  const k = e.key.toLowerCase();
  if (k.length === 1 && "1234".indexOf(k) !== -1) pick(Number(k) - 1);
  else if (k.length === 1 && "abcd".indexOf(k) !== -1) pick("abcd".indexOf(k));
  else if ((e.key === "Enter" || e.key === " ") && S.sel !== null) { e.preventDefault(); next(); }
});

reset(ITEMS);
</script>
